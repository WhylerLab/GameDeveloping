<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdleDev-by-NoahWhyler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="content_wrapper">

        <div class="topic">
            <h1>IdleDev</h1>
            <p>practice</p>
        </div>

        <div class="resource_wrapper">
            <div class="resource loc">
                <div class="label_resource">Lines of Code</div>
                <div id="loc_total_counter"></div>
            </div>
            <div class="resource money">
                <div class="label_resource">Money</div>
                <div id="money_total_counter">0</div>
            </div>
        </div>

        <div class="product_wrapper">
            <div class="product script_file">
                <div class="label_product">Scripts</div>
                <div id="script_file">0</div>
            </div>
            <div class="product app_file">
                <div class="label_product">Apps</div>
                <div id="app_file">0</div>
            </div>
            <div class="product bug_report">
                <div class="label_product">Bugs</div>
                <div id="bug_report">0</div>
            </div>
        </div>

        <div class="progress_wrapper">
            <div class="progress script_file_progress">
                <div class="label_progress">Script progress</div>
                <div class="progressbar_script">
                    <div class="progressbar_fill_script"></div>
                </div>
            </div>
            <div class="progress app_file_progress">
                <div class="label_progress">App progress</div>
                <div class="progressbar_apps">
                    <div class="progressbar_fill_apps"></div>
                </div>
            </div>
        </div>

        <div class="player_menu_wrapper">
            <div class="action_wrapper">
                <div class="label_action">Actions</div>
                <div class="loc_action">
                    <p> Write some Code</p>
                    <span>Income: </span><span id="">0</span>
                    <button id="write_loc_btn">Write Line of Code</button>
                </div>
            </div>
            <div class="market_wrapper">
                <div class="label_market">Generators</div>
                <div class="generator_wrapper">
                    <p class="">Trainee</p>
                    <span>Stock: </span><span id="">0</span>
                    <br>
                    <span>Income: </span><span id="">0</span>
                    <button id="trainee_btn">Hire Trainee</button>
                </div>
                <div class="upgrade_wrapper">

                </div>
            </div>
        </div>

    </div>

    <div class="footer"></div>


    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
